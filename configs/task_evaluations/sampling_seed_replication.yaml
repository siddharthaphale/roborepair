  tasks: [cube_lift, cube_stack]
  sim_version: "robosuite-1.5.2+mujoco-3.3.5"
  asset_version: "robosuite-1.5.2"

replication:
  stage_name: sampling_seed_replication
  tier: "high_level"
  max_retries: 5
  wave_size: 16
  eval_cap: 60
  task_evaluation_run_dir: runs/task_model_evaluation_7b_seed0
  cells:
    - {id: cube_lift_pose_shift_7b, task: cube_lift, arms: [resample, template_feedback, donor_feedback]}
    - {id: cube_stack_distractor_7b, task: cube_stack, arms: [resample, template_feedback, donor_feedback]}
