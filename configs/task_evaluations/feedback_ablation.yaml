stage: feedback_ablation

seeds:
  sim: 0
  gen: 0
  train: 0
  perturb: 0

model:
  name: "Qwen/Qwen2.5-Coder-7B-Instruct"
  revision: "c03e6d358207e414f1eca0bb1891e29f1db0e242"
  tokenizer_revision: "c03e6d358207e414f1eca0bb1891e29f1db0e242"
  quantization: "none"

decoding:
  temperature: 0.7
  top_p: 0.95
  max_output_tokens: 1024
  code_timeout_s: 60
  trace_input_token_cap: 768
  rawlog_input_token_cap: 768

env:
  backend: robosuite
  tasks: [cube_lift, cube_stack]
  sim_version: "robosuite-1.5.2+mujoco-3.3.5"
  asset_version: "robosuite-1.5.2"

feedback_ablation:
  failure_bank: data/failure_banks/evaluation_failures.jsonl
  tier: "high_level"
  max_retries: 5
  wave_size: 16
  arms: [resample, template_feedback, donor_feedback, failure_label_feedback, reflection_regeneration, structured_plan_with_editing]
  structured_plan_sample_size: 60  # Subset size for the structured-plan control.
  pass_criteria:
    p1_pp: 5
    p2_pp: 5
    noninferiority_all_k_pp: -2
    validity_gap_max_pp: 3
    safety_gap_max_pp: 3
    steering_relative_reduction_min: 0.20
