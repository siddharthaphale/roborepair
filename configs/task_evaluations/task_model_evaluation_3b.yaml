stage: task_model_evaluation_3b

seeds:
  sim: 0
  gen: 0
  train: 0
  perturb: 0

model:
  name: "Qwen/Qwen2.5-Coder-3B-Instruct"
  revision: "488639f1ff808d1d3d0ba301aef8c11461451ec5"
  tokenizer_revision: "488639f1ff808d1d3d0ba301aef8c11461451ec5"
  quantization: "none"

decoding:
  temperature: 0.7
  top_p: 0.95
  max_output_tokens: 1024
  code_timeout_s: 60
  trace_input_token_cap: 768
  rawlog_input_token_cap: 768

env:
  backend: robosuite
  tasks: [cube_lift, cube_stack, cube_to_zone, place_in_bin]
  sim_version: "robosuite-1.5.2+mujoco-3.3.5"
  asset_version: "robosuite-1.5.2"

task_evaluation:
  stage_name: task_model_evaluation_3b
  tier: "high_level"
  max_retries: 5
  wave_size: 16
  programs_per_cell: 80
  eval_cap: 60
  min_eval_failures: 40
  band_confirmatory: [0.10, 0.70]
  band_reported: [0.05, 0.80]
  cells:
    - {id: cube_lift_3b, task: cube_lift, perturbation: null, sim_seed_start: 1300,
       arms: [resample, template_feedback, donor_feedback]}
    - {id: cube_stack_3b, task: cube_stack, perturbation: null, sim_seed_start: 1400,
       arms: [resample, template_feedback, donor_feedback]}

    - {id: cube_to_zone_3b, task: cube_to_zone, perturbation: null, sim_seed_start: 1500,
       arms: [resample, template_feedback, donor_feedback, reflection_regeneration]}
    - {id: place_in_bin_3b, task: place_in_bin, perturbation: null, sim_seed_start: 1600,
       arms: [resample, template_feedback, donor_feedback, reflection_regeneration]}
