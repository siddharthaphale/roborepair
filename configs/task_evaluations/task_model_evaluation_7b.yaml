stage: task_model_evaluation_7b

seeds:
  sim: 0
  gen: 0
  train: 0
  perturb: 0

model:
  name: "Qwen/Qwen2.5-Coder-7B-Instruct"
  revision: "c03e6d358207e414f1eca0bb1891e29f1db0e242"
  tokenizer_revision: "c03e6d358207e414f1eca0bb1891e29f1db0e242"
  quantization: "none"

decoding:
  temperature: 0.7
  top_p: 0.95
  max_output_tokens: 1024
  code_timeout_s: 60
  trace_input_token_cap: 768
  rawlog_input_token_cap: 768

env:
  backend: robosuite
  tasks: [cube_lift, cube_stack, cube_to_zone, place_in_bin]
  sim_version: "robosuite-1.5.2+mujoco-3.3.5"
  asset_version: "robosuite-1.5.2"

task_evaluation:
  stage_name: task_model_evaluation_7b
  tier: "high_level"
  max_retries: 5
  wave_size: 16
  programs_per_cell: 80  # >=40 eval failures even at ~50% initial success
  eval_cap: 60  # Caps evaluation cost; at least 40 failures are required.
  min_eval_failures: 40
  band_confirmatory: [0.10, 0.70]
  band_reported: [0.05, 0.80]
  cells:
    - {id: cube_to_zone_7b, task: cube_to_zone, perturbation: null, sim_seed_start: 500,
       arms: [resample, template_feedback, donor_feedback, reflection_regeneration]}
    - {id: place_in_bin_7b, task: place_in_bin, perturbation: null, sim_seed_start: 600,
       arms: [resample, template_feedback, donor_feedback, reflection_regeneration]}
    - {id: cube_lift_pose_shift_7b, task: cube_lift, perturbation: pose_shift, sim_seed_start: 700,
       arms: [resample, template_feedback, donor_feedback]}
    - {id: cube_lift_paraphrase_7b, task: cube_lift, perturbation: paraphrase, sim_seed_start: 800,
       arms: [resample, template_feedback, donor_feedback]}
    - {id: cube_lift_distractor_7b, task: cube_lift, perturbation: distractor, sim_seed_start: 900,
       arms: [resample, template_feedback, donor_feedback]}
    - {id: cube_stack_pose_shift_7b, task: cube_stack, perturbation: pose_shift, sim_seed_start: 1000,
       arms: [resample, template_feedback, donor_feedback]}
    - {id: cube_stack_paraphrase_7b, task: cube_stack, perturbation: paraphrase, sim_seed_start: 1100,
       arms: [resample, template_feedback, donor_feedback]}
    - {id: cube_stack_distractor_7b, task: cube_stack, perturbation: distractor, sim_seed_start: 1200,
       arms: [resample, template_feedback, donor_feedback]}
