stage: model_scale_evaluation_80_programs

seeds:
  sim: 0
  gen: 0
  train: 0
  perturb: 0

model:
  name: "Qwen/Qwen2.5-Coder-32B-Instruct"
  revision: "381fc969f78efac66bc87ff7ddeadb7e73c218a7"
  tokenizer_revision: "381fc969f78efac66bc87ff7ddeadb7e73c218a7"
  quantization: "none"

decoding:
  temperature: 0.7
  top_p: 0.95
  max_output_tokens: 1024
  code_timeout_s: 60
  trace_input_token_cap: 768
  rawlog_input_token_cap: 768

env:
  backend: robosuite
  tasks: [cube_lift, cube_stack]
  sim_version: "robosuite-1.5.2+mujoco-3.3.5"
  asset_version: "robosuite-1.5.2"

task_evaluation:
  stage_name: model_scale_evaluation_80_programs
  tier: "high_level"
  max_retries: 5
  wave_size: 8  # memory headroom for the 32B model
  programs_per_cell: 80
  eval_cap: 60
  min_eval_failures: 40
  band_confirmatory: [0.10, 0.70]
  band_reported: [0.05, 0.80]
  cells:
    - {id: cube_lift_pose_shift_32b, task: cube_lift, perturbation: pose_shift, sim_seed_start: 2700,
       arms: [resample, template_feedback, donor_feedback, reflection_regeneration]}
    - {id: cube_stack_distractor_32b, task: cube_stack, perturbation: distractor, sim_seed_start: 2800,
       arms: [resample, template_feedback, donor_feedback, reflection_regeneration]}
